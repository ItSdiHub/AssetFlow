<!-- EMPLOYEE FORM WITH OFFICE FIELD -->
<!-- This snippet replaces the employee modal form section around line 3447 -->

<!-- Add this NEW field after Department field (formEmpDept) -->
<div class="form-group">
  <label><span data-i18n="location">مكتب التابعية (الموقع)</span>*</label>
  <select id="formEmpOffice" class="form-control" required onchange="EmployeeManager.onOfficeChange()">
    <option value="">اختر مكتب...</option>
    <!-- Populated via JS - filters by department -->
  </select>
  <small class="text-muted" style="display: block; margin-top: 4px;">
    <i class="fas fa-info-circle"></i> <span data-i18n="officeHint">يتم تحديد قائمة المكاتب بناءً على القسم المختار</span>
  </small>
</div>

<!-- DEPARTMENT FORM WITH LOCATION FIELD -->
<!-- This snippet replaces the department modal form section around line 3515 -->

<!-- Add this NEW field after manager name or before save button -->
<div class="form-group">
  <label><span data-i18n="location">الموقع الرئيسي (الفرع)</span>*</label>
  <select id="formDeptLocation" class="form-control" required>
    <option value="">اختر موقع...</option>
    <!-- Populated via JS -->
  </select>
  <small class="text-muted" style="display: block; margin-top: 4px;">
    <i class="fas fa-info-circle"></i> <span data-i18n="locationHint">يتم ربط القسم بالموقع الرئيسي له (الفرع أو المكتب الرئيسي)</span>
  </small>
</div>
